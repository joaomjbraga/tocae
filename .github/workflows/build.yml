name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-version:
    name: Prepare version tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      tag: ${{ steps.prepare.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create version tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release version: ${version}" >&2
            exit 1
          fi

          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git tag "${tag}"
            git push origin "${tag}"
          else
            echo "Tag ${tag} already exists."
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} already exists; skipping builds."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: prepare-version
    if: >-
      always() &&
      (
        github.event_name != 'push' ||
        github.ref != 'refs/heads/main' ||
        (
          needs.prepare-version.result == 'success' &&
          needs.prepare-version.outputs.should_build == 'true'
        )
      )
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:windows

      - uses: actions/upload-artifact@v4
        with:
          name: tocae-reprodutor-windows
          path: release/*/*.exe
          if-no-files-found: error

  build-linux:
    name: Build .deb and .rpm
    runs-on: ubuntu-latest
    needs: prepare-version
    if: >-
      always() &&
      (
        github.event_name != 'push' ||
        github.ref != 'refs/heads/main' ||
        (
          needs.prepare-version.result == 'success' &&
          needs.prepare-version.outputs.should_build == 'true'
        )
      )
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O rpmbuild é exigido pelo electron-builder para gerar o .rpm.
      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - run: npm run lint
      - run: npm test

      # O script já roda a verificação de tipos e o bundle antes do pacote.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: tocae-reprodutor-linux
          path: |
            release/*/*.deb
            release/*/*.rpm
          if-no-files-found: error

  publish-release:
    name: Publish installers
    runs-on: ubuntu-latest
    needs: [prepare-version, build-windows, build-linux]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.prepare-version.result == 'success' &&
      needs.prepare-version.outputs.should_build == 'true' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tocae-reprodutor-windows
          path: release-assets/windows

      - uses: actions/download-artifact@v4
        with:
          name: tocae-reprodutor-linux
          path: release-assets/linux

      - name: Select installer assets
        id: installers
        run: |
          set -euo pipefail
          expected=( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' )
          mapfile -t assets < <(find release-assets -type f \( "${expected[@]}" \) -print | sort)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "Nenhum instalador encontrado em release-assets." >&2
            exit 1
          fi

          # Garante que arquivos acidentais (ex.: um .mp4 gerado por alguma
          # dependência) não virem asset da release.
          unexpected=$(find release-assets -type f ! \( "${expected[@]}" \) -print)
          if [ -n "$unexpected" ]; then
            echo "Arquivos que não são instaladores serão ignorados:" >&2
            echo "$unexpected" >&2
          fi

          printf '%s\n' "${assets[@]}" > installer-files.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < installer-files.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "Tocaê Reprodutor $TAG" \
              --generate-notes
            gh release upload "$TAG" "${assets[@]}"
          fi
